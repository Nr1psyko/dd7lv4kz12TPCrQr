<style>
  :root {
    --ink: #f3efe6;
    --void: #070707;
    --dim: #8a857c;
    --line: #222;
    --pad-t: max(20px, env(safe-area-inset-top));
    --pad-b: max(32px, env(safe-area-inset-bottom));
    --pad-x: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--void); color: var(--ink); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
    padding: var(--pad-t) var(--pad-x) var(--pad-b);
    min-height: 100dvh;
    min-height: -webkit-fill-available;
  }
  h1 {
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
    margin: 28px 0 10px;
  }
  h1:first-of-type { margin-top: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
  .rate {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .rate label { font-size: 12px; color: var(--dim); }
  .rate .hint { font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  input[type="number"] {
    background: #111;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 10px 12px;
    width: 132px;
    font-size: 16px;
    line-height: 1.2;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    font-variant-numeric: tabular-nums;
  }
  .hero { display: grid; gap: 10px; margin: 0 0 16px; }
  .card {
    border: 1px solid var(--line);
    padding: 18px 16px 16px;
  }
  .card .k {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .card .n {
    font-size: clamp(36px, 12vw, 56px);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .avg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .avg .card .n {
    font-size: clamp(20px, 6.4vw, 28px);
    font-weight: 600;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 9px 6px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    vertical-align: top;
  }
  th {
    color: var(--dim);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  td.r, th.r { text-align: right; }
  .why { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .split { white-space: nowrap; color: var(--dim); }
  .song { max-width: 42vw; word-break: break-word; }
</style>
</head>

const euro = n => "€" + n.toLocaleString("nl-NL", {minimumFractionDigits:2, maximumFractionDigits:2});
function mixShare(songs, totalStreams) {
  if (!totalStreams) return 0.5;
  let w = 0;
  for (const s of songs) w += s.streams * s.share;
  return w / totalStreams;
}
function render() {
  const rate = parseFloat(document.getElementById("rate").value || "0");
  const days = DATA.days.slice().reverse();
  const last7 = DATA.days.slice(-7);
  const s7 = last7.reduce((a,d)=>a+d.streams,0);
  const share = mixShare(DATA.songs7, DATA.songs7.reduce((a,s)=>a+s.streams,0));
  const y = DATA.days[DATA.days.length-1];
  document.getElementById("yGross").textContent = euro(y.streams * rate);
  document.getElementById("yMine").textContent = euro(y.streams * rate * share);
  document.getElementById("wGross").textContent = euro((s7 * rate) / 7);
  document.getElementById("wMine").textContent = euro((s7 * rate * share) / 7);
  document.querySelector("#days tbody").innerHTML = days.map(d => {
    const g = d.streams * rate, m = g * share;
    return `<tr><td>${d.date}</td><td class="r">${d.streams.toLocaleString("nl-NL")}</td><td class="r">${euro(g)}</td><td class="r">${euro(m)}</td></tr>`;
  }).join("");
  document.querySelector("#songs tbody").innerHTML = DATA.songs7.map(s => {
    const g = s.streams * rate, m = g * s.share;
    return `<tr><td class="song">${s.song}<div class="why">${s.why}</div></td><td class="split">${Math.round(s.share*100)}%</td><td class="r">${s.streams.toLocaleString("nl-NL")}</td><td class="r">${euro(g)}</td><td class="r">${euro(m)}</td></tr>`;
  }).join("");
}
document.getElementById("rate").value = DATA.rate_eur;
document.getElementById("rate").addEventListener("input", render);
